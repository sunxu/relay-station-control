name: ${CONTROL_HISTORY_PROCESS_PROJECT:?set CONTROL_HISTORY_PROCESS_PROJECT}

services:
  postgres:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    command: ["postgres", "-c", "max_connections=24"]
    environment:
      POSTGRES_DB: relay_station_control
      POSTGRES_USER: relay_control_migrator
      POSTGRES_PASSWORD: relay_control_migrator_dev_only
      TZ: UTC
      PGTZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay_control_migrator -d relay_station_control"]
      interval: 1s
      timeout: 2s
      retries: 60
    ports:
      - "127.0.0.1:${CONTROL_HISTORY_PROCESS_DB_PORT:-55439}:5432"
    volumes:
      - history-process-postgres-data:/var/lib/postgresql
      - ../postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  history-process-postgres-data:
