name: ${CONTROL_READONLY_QUERY_POSTGRES_PROJECT:?set CONTROL_READONLY_QUERY_POSTGRES_PROJECT}

services:
  data-plane:
    image: eceasy/cli-proxy-api@sha256:7f598ce64478a8a5f90ed76875e0e9b0e7d77b80e17184b13df18c3d5bdb3def
    command: ["./CLIProxyAPI", "-config", "/CLIProxyAPI/readonly-query-config.yaml", "-local-model"]
    user: "${CONTROL_READONLY_QUERY_HOST_UID:?set CONTROL_READONLY_QUERY_HOST_UID}:${CONTROL_READONLY_QUERY_HOST_GID:?set CONTROL_READONLY_QUERY_HOST_GID}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - ${CONTROL_READONLY_QUERY_RUNTIME_DIRECTORY:?set CONTROL_READONLY_QUERY_RUNTIME_DIRECTORY}/config.yaml:/CLIProxyAPI/readonly-query-config.yaml:ro
      - ${CONTROL_READONLY_QUERY_RUNTIME_DIRECTORY:?set CONTROL_READONLY_QUERY_RUNTIME_DIRECTORY}/auth:/run/readonly-query-auth:ro
    networks:
      - isolated

  data-plane-probe:
    image: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    entrypoint: ["/bin/sh", "/run/acceptance/probe.sh"]
    command: ["1"]
    user: "${CONTROL_READONLY_QUERY_HOST_UID:?set CONTROL_READONLY_QUERY_HOST_UID}:${CONTROL_READONLY_QUERY_HOST_GID:?set CONTROL_READONLY_QUERY_HOST_GID}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - ./account-inventory-readonly-query-data-plane-probe.sh:/run/acceptance/probe.sh:ro
      - ${CONTROL_READONLY_QUERY_RUNTIME_DIRECTORY:?set CONTROL_READONLY_QUERY_RUNTIME_DIRECTORY}/data-plane-key:/run/acceptance/data-plane-key:ro
    networks:
      - isolated

  postgres:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    command: ["postgres", "-c", "max_connections=24"]
    environment:
      POSTGRES_DB: relay_station_control
      POSTGRES_USER: relay_control_migrator
      POSTGRES_PASSWORD: relay_control_migrator_dev_only
      TZ: UTC
      PGTZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay_control_migrator -d relay_station_control"]
      interval: 1s
      timeout: 2s
      retries: 60
    ports:
      - "127.0.0.1::5432"
    volumes:
      - readonly-query-postgres-data:/var/lib/postgresql
      - ../postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  readonly-query-postgres-data:

networks:
  isolated:
    internal: true
