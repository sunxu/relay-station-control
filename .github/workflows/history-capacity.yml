name: History capacity

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      scale:
        description: Snapshot rows per sample; smoke is not capacity evidence
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - "864000"
          - "1152000"
      keep_logs:
        description: Upload the failed capacity.log as a diagnostic artifact (raw, not evidence)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: history-capacity-${{ github.event_name }}-${{ inputs.scale || github.run_id }}
  cancel-in-progress: false

jobs:
  nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        scale:
          - "864000"
          - "1152000"
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Free runner disk space
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android \
            /usr/local/share/powershell /usr/local/lib/node_modules
          df -h /

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Run PostgreSQL 18 history capacity
        run: env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u http_proxy -u https_proxy -u all_proxy deploy/acceptance/account-inventory-history-capacity.sh '${{ matrix.scale }}'

  manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Free runner disk space
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android \
            /usr/local/share/powershell /usr/local/lib/node_modules
          df -h /

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Run PostgreSQL 18 history capacity
        env:
          CONTROL_HISTORY_CAPACITY_KEEP_LOGS: ${{ inputs.keep_logs && '1' || '0' }}
        run: env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u http_proxy -u https_proxy -u all_proxy deploy/acceptance/account-inventory-history-capacity.sh '${{ inputs.scale }}'

      - name: Upload capacity diagnostic log
        if: failure() && inputs.keep_logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: history-capacity-failed-log
          path: /tmp/history-capacity-failed.log
          if-no-files-found: error
