name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  ALL_PROXY: ""
  http_proxy: ""
  https_proxy: ""
  all_proxy: ""
  NO_PROXY: "*"
  no_proxy: "*"
  GOPROXY: https://goproxy.cn,direct
  npm_config_registry: https://registry.npmmirror.com
  OPENSPEC_VERSION: "1.10.0"

jobs:
  quality:
    name: Generate, test, build, and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Generate committed artifacts
        run: make generate

      - name: Verify generated artifacts are committed
        run: git diff --exit-code

      - name: Run tests
        run: make test

      - name: Build
        run: make build

      - name: Run Go vet
        run: go vet ./...

      - name: Validate active OpenSpec change
        run: npx --yes @fission-ai/openspec@${OPENSPEC_VERSION} validate add-control-account-inventory-snapshot-foundation --strict

      - name: Validate all OpenSpec specifications
        run: npx --yes @fission-ai/openspec@${OPENSPEC_VERSION} validate --all --strict

      - name: Check patches for whitespace errors
        run: git diff --check

  race:
    name: Go race detector
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run Go tests with the race detector
        run: go test -race ./... -count=1
