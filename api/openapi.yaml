        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-relay_control_session
      description: |
        Opaque administrator session cookie. In production it is set with Secure,
        HttpOnly, SameSite=Strict, Path=/, no Domain, a 30-minute idle timeout, and a
        12-hour absolute timeout. It is never a bearer token for service identities.

  parameters:
    AdministratorId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BootstrapSecret:
      name: X-Bootstrap-Secret
      in: header
      required: true
      description: Runtime-only bootstrap secret. It must never be logged, persisted, or returned.
      schema:
        type: string
        minLength: 32
        writeOnly: true
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Random proof bound to the current administrator session.
      schema:
        type: string
        minLength: 32
        writeOnly: true
    OptionalCsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required only when logout receives a parseable administrator session cookie.
      schema:
        type: string
        minLength: 32
        writeOnly: true
    PageLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    PageCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 512
    AssetPageLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    NodeInstanceId:
      name: instance_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GatewayInstanceId:
      name: instance_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OccurrenceId:
      name: occurrence_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  headers:
    AuthenticationSetCookie:
      description: |
        Sets either the MFA challenge cookie or, only when non-production MFA is
        explicitly disabled, the full session cookie. Both are HttpOnly and
        SameSite=Strict; production cookies are Secure and have no Domain.
      schema:
        type: string
    NoStore:
      description: Sensitive authentication and administrator responses are never cacheable.
      required: true
      schema:
        type: string
        enum:
          - no-store
    OptionalSessionSetCookie:
      description: Present only when activation is completed; clears activation state and sets the session cookie.
      schema:
        type: string
    RequestId:
      description: Stable request correlation identifier safe to show to an administrator.
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
    SessionClearCookie:
      description: Expires the administrator session cookie after server-side revocation.
      schema:
        type: string
    SessionSetCookie:
      description: |
        Sets the opaque administrator session cookie and clears any MFA challenge
        cookie. Production uses __Host-relay_control_session with Secure, HttpOnly,
        SameSite=Strict, Path=/, and no Domain.
      schema:
        type: string

  responses:
    Error:
      description: Request rejected using the uniform error envelope.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Retry-After:
          description: Present for a rate-limited request, in seconds.
          schema:
            type: integer
            minimum: 1
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    AccountInventoryQueryRequest:
      type: object
      additionalProperties: false
      required: [instance_id]
      properties:
        instance_id:
          type: string
          format: uuid
        provider:
          $ref: "#/components/schemas/ProviderName"
        lifecycle:
          $ref: "#/components/schemas/AccountInventoryLifecycle"
        basic_status:
          $ref: "#/components/schemas/AccountInventoryBasicStatus"
        email:
          $ref: "#/components/schemas/NormalizedAccountEmail"
        cursor:
          type: string
          minLength: 1
          maxLength: 1536
          description: Opaque, encrypted, actor- and filter-bound continuation token.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 50

    AccountInventoryQueryResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AccountInventoryItem"
        next_cursor:
          type: [string, "null"]
          maxLength: 1536

    AccountInventoryItem:
      type: object
      additionalProperties: false
      required:
        - instance_id
        - provider
        - email
        - basic_status
        - lifecycle
        - consecutive_missing_count
        - first_seen_at
        - last_seen_at
        - missing_since
        - out_of_scope_since
        - last_refresh_at
        - next_retry_at
        - source_updated_at
        - provider_last_complete_at
        - provider_degraded
        - snapshot_freshness
      properties:
        instance_id:
          type: string
          format: uuid
        provider:
          $ref: "#/components/schemas/ProviderName"
        email:
          $ref: "#/components/schemas/NormalizedAccountEmail"
        basic_status:
          $ref: "#/components/schemas/AccountInventoryBasicStatus"
        lifecycle:
          $ref: "#/components/schemas/AccountInventoryLifecycle"
        consecutive_missing_count:
          type: integer
          minimum: 0
          maximum: 2
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        missing_since:
          type: [string, "null"]
          format: date-time
        out_of_scope_since:
          type: [string, "null"]
          format: date-time
        last_refresh_at:
          type: [string, "null"]
          format: date-time
        next_retry_at:
          type: [string, "null"]
          format: date-time
        source_updated_at:
          type: [string, "null"]
          format: date-time
        provider_last_complete_at:
          type: string
          format: date-time
        provider_degraded:
          type: boolean
        snapshot_freshness:
          $ref: "#/components/schemas/AccountInventorySnapshotFreshness"

    AccountInventoryLifecycle:
      type: string
      enum: [present, suspected_missing, missing, out_of_scope]

    AccountInventoryBasicStatus:
      type: string
      description: Last status reported by the Relay Node, not current schedulability.
      enum: [reported_active, disabled, unavailable, error, unknown]

    AccountInventorySnapshotFreshness:
      type: string
      enum: [fresh, stale, out_of_scope]

    NormalizedAccountEmail:
      type: string
      minLength: 1
      maxLength: 320
      description: Trimmed, lowercase exact-match account identity; never placed in a URL or audit detail.

    JobListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/JobSummary"
        next_cursor:
          type: [string, "null"]
          maxLength: 512

    JobSummary:
      type: object
      additionalProperties: false
      required:
        - job_id
        - operation_id
        - job_kind
        - status
        - attempt_count
        - max_attempts
        - available_at
        - cancel_requested
        - outbox_status
        - created_at
        - updated_at
      properties:
        job_id:
          type: string
          format: uuid
        operation_id:
          type: string
          format: uuid
        job_kind:
          $ref: "#/components/schemas/JobKind"
        status:
          $ref: "#/components/schemas/JobStatus"
        attempt_count:
          type: integer
          minimum: 0
        max_attempts:
          type: integer
          minimum: 1
        available_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time
        cancel_requested:
          type: boolean
        error_code:
          oneOf:
            - $ref: "#/components/schemas/JobErrorCode"
            - type: "null"
        outbox_status:
          $ref: "#/components/schemas/JobOutboxStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    JobDetail:
      type: object
      additionalProperties: false
      required:
        - job_id
        - operation_id
        - job_kind
        - status
        - attempt_count
        - max_attempts
        - available_at
        - cancel_requested
        - outbox_status
        - created_at
        - updated_at
        - events
      properties:
        job_id:
          type: string
          format: uuid
        operation_id:
          type: string
          format: uuid
        job_kind:
          $ref: "#/components/schemas/JobKind"
        status:
          $ref: "#/components/schemas/JobStatus"
        attempt_count:
          type: integer
          minimum: 0
        max_attempts:
          type: integer
          minimum: 1
        available_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time
        cancel_requested:
          type: boolean
        error_code:
          oneOf:
            - $ref: "#/components/schemas/JobErrorCode"
            - type: "null"
        outbox_status:
          $ref: "#/components/schemas/JobOutboxStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        events:
          type: array
          items:
            $ref: "#/components/schemas/JobLifecycleEvent"

    JobLifecycleEvent:
      type: object
      additionalProperties: false
      required: [sequence, event_type, to_status, attempt_count, actor_type, occurred_at]
      properties:
        sequence:
          type: integer
          minimum: 1
        event_type:
          $ref: "#/components/schemas/JobEventType"
        from_status:
          oneOf:
            - $ref: "#/components/schemas/JobStatus"
            - type: "null"
        to_status:
          $ref: "#/components/schemas/JobStatus"
        attempt_count:
          type: integer
          minimum: 0
        actor_type:
          $ref: "#/components/schemas/JobActorType"
        reason_code:
          oneOf:
            - $ref: "#/components/schemas/JobReasonCode"
            - type: "null"
        error_code:
          oneOf:
            - $ref: "#/components/schemas/JobErrorCode"
            - type: "null"
        occurred_at:
          type: string
          format: date-time

    JobStatus:
      type: string
      enum: [pending, running, verifying, retry_wait, rolling_back, succeeded, failed, rolled_back, cancelled]

    JobOutboxStatus:
      type: string
      enum: [pending, publishing, sent, suppressed, retry_wait, failed]

    JobEventType:
      type: string
      enum: [enqueued, claimed, retry_scheduled, verification_started, rollback_started, succeeded, failed, rolled_back, cancelled, cancel_requested]

    JobActorType:
      type: string
      enum: [service, worker, reconciler, system]

    JobKind:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[a-z][a-z0-9._-]*$"

    JobErrorCode:
