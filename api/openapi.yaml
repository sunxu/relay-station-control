            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrossNodeDuplicateOccurrenceListResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/cross-node-duplicate-occurrences/{occurrence_id}:
    get:
      operationId: getCrossNodeDuplicateOccurrence
