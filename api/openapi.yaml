  /api/relay-bindings/bind:
    post:
      operationId: bindRelayNode
      summary: Bind an unbound Relay Node to a fresh Gateway Account
      description: |
        Requires super_admin session and CSRF proof. Validates Directory freshness (<=540s)
        and account presence within a single transactional boundary.
      tags: [relay-bindings]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindRelayNodeRequest"
      responses:
        "200":
          description: Relay Node successfully bound to Gateway Account.
          headers:
