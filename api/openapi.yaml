              $ref: "#/components/headers/NoStore"
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelayBindingMutationResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/relay-bindings/rebind:
    post:
      operationId: rebindRelayNode
      summary: Atomically rebind a currently bound Relay Node to another fresh Gateway Account
      description: |
        Requires super_admin session and CSRF proof. Closes the old interval and creates a new
        interval in a single transaction with identical timestamp.
      tags: [relay-bindings]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RebindRelayNodeRequest"
      responses:
        "200":
          description: Relay Node successfully rebound to new Gateway Account.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelayBindingMutationResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/relay-bindings/unbind:
    post:
      operationId: unbindRelayNode
      summary: Unbind a currently bound Relay Node
      description: |
        Requires super_admin session and CSRF proof. Closes open interval with administrator_unbind.
        Idempotent if already unbound.
      tags: [relay-bindings]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnbindRelayNodeRequest"
      responses:
        "200":
          description: Relay Node unbind mutation completed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelayBindingMutationResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/cross-node-duplicate-occurrences:
    get:
      operationId: listCrossNodeDuplicateOccurrences
      summary: List Cross-node Duplicate Ownership occurrences
      description: |
        Returns a bounded, reverse-chronological (last_seen_at DESC) page of
        Cross-node Duplicate Ownership occurrences. account_key is returned
