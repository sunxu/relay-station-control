                $ref: "#/components/schemas/CrossNodeDuplicateOccurrenceSummary"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/cross-node-duplicate-occurrences/{occurrence_id}/evidence:
    get:
      operationId: listCrossNodeDuplicateOccurrenceEvidence
      summary: List evidence observations for one Cross-node Duplicate Ownership occurrence
      description: |
