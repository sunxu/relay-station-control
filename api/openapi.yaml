            maxLength: 385
        - name: instance_id
          in: query
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/AssetPageLimit"
      responses:
        "200":
          description: A bounded page of Cross-node Duplicate Ownership occurrences.
          headers:
