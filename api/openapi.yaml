      summary: List durable Control jobs
      description: |
        Returns a stable, redacted view of durable jobs. Payloads, payload hashes,
        idempotency keys, leases, Outbox envelopes, and error summaries are never projected.
      tags: [jobs]
      parameters:
        - name: job_kind
